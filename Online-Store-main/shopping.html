<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="查看购物车中的绿源农业商品，调整数量并汇总金额。">
    <title>购物车 | 绿源农业</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/shopping.css">
</head>
<body>
    <nav>
        <div class="nav-container">
            <a class="nav-brand" href="index.html">绿源农业</a>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="products.html">产品中心</a>
                <a href="about.html">关于我们</a>
                <a href="shopping.html" class="active" aria-current="page">购物车</a>
                <span class="nav-account" id="nav-account"><a href="login.html">登录</a></span>
            </div>
        </div>
    </nav>

    <main class="cart-container">
        <div class="cart-header">
            <h1>购物车</h1>
            <p id="cart-count" aria-live="polite">您已选择 0 件商品</p>
        </div>

        <div class="cart-items" id="cart-items-container">
            <!-- 购物车商品由 js/shopping.js 动态渲染 -->
        </div>

        <aside class="summary-card" id="summary-card" hidden>
            <div class="summary-row">
                <span>商品合计</span>
                <span id="subtotal">¥0.00</span>
            </div>
            <div class="summary-row">
                <span>运费</span>
                <span>¥0.00</span>
            </div>
            <div class="summary-row">
                <span>优惠</span>
                <span class="discount">-¥0.00</span>
            </div>
            <div class="summary-row total-price">
                <span>总计</span>
                <span id="total">¥0.00</span>
            </div>
            <button type="button" class="modern-cta checkout-btn" id="checkout-btn">
                <span>前往结算</span>
                <svg class="icon-arrow" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                    <path fill="currentColor" d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
                </svg>
            </button>
        </aside>

        <section class="checkout-panel" id="checkout-panel" hidden>
            <h2>确认订单</h2>
            <form id="checkout-form">
                <div class="checkout-fields">
                    <div class="form-field">
                        <label for="shipping-name">收货人</label>
                        <input id="shipping-name" name="shippingName" type="text"
                               placeholder="请输入收货人姓名" minlength="2" maxlength="30"
                               autocomplete="name" required>
                    </div>
                    <div class="form-field">
                        <label for="shipping-phone">联系电话</label>
                        <input id="shipping-phone" name="shippingPhone" type="tel"
                               placeholder="请输入手机号或固定电话" minlength="6" maxlength="20"
                               inputmode="tel" autocomplete="tel" required>
                    </div>
                    <div class="form-field">
                        <label for="shipping-address">收货地址</label>
                        <input id="shipping-address" name="shippingAddress" type="text"
                               placeholder="省市区 + 详细地址" minlength="5" maxlength="200"
                               autocomplete="street-address" required>
                    </div>
                </div>
                <p class="form-message" id="checkout-message" role="alert" hidden></p>
                <div class="checkout-actions">
                    <button type="submit" class="modern-cta">
                        <span>提交订单</span>
                        <svg class="icon-arrow" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                            <path fill="currentColor" d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
                        </svg>
                    </button>
                    <button type="button" class="btn-secondary" id="checkout-cancel">取消</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h3>产品与服务</h3>
                <p><i class="fas fa-seedling" aria-hidden="true"></i> 当季蔬果</p>
                <p><i class="fas fa-apple-alt" aria-hidden="true"></i> 时令水果</p>
                <p><i class="fas fa-spa" aria-hidden="true"></i> 园艺花卉</p>
            </div>
            <div class="footer-section">
                <h3>联系我们</h3>
                <p><i class="fas fa-phone" aria-hidden="true"></i> 400-800-1234</p>
                <p><i class="fas fa-envelope" aria-hidden="true"></i> dsjd@vcsc.org.cn</p>
                <p><i class="fas fa-trophy" aria-hidden="true"></i> 世界职业院校技能大赛</p>
            </div>
            <div class="footer-section">
                <h3>关注我们</h3>
                <div class="social-icons">
                    <a href="#" aria-label="微信"><i class="fab fa-weixin" aria-hidden="true"></i></a>
                    <a href="#" aria-label="微博"><i class="fab fa-weibo" aria-hidden="true"></i></a>
                    <a href="#" aria-label="抖音"><i class="fab fa-tiktok" aria-hidden="true"></i></a>
                    <a href="#" aria-label="Instagram"><i class="fab fa-instagram" aria-hidden="true"></i></a>
                </div>
            </div>
        </div>
        <div class="copyright">
            <p>© 2025 绿源农业 版权所有 | 有机食品认证号: OC-2023-12345</p>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/auth-nav.js"></script>
    <script src="js/cart-store.js"></script>
    <script src="js/shopping.js"></script>
</body>
</html>
