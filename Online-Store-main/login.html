<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="登录或注册绿源农业账户。">
    <title>登录注册 | 绿源农业</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <nav>
        <div class="nav-container">
            <a class="nav-brand" href="index.html">绿源农业</a>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="products.html">产品中心</a>
                <a href="about.html">关于我们</a>
                <a href="shopping.html">购物车</a>
                <span class="nav-account" id="nav-account"><a href="login.html" class="active" aria-current="page">登录</a></span>
            </div>
        </div>
    </nav>

    <main class="auth-container">
        <div class="auth-card">
            <h1 class="sr-only">登录或注册绿源农业账户</h1>
            <p class="form-message" id="form-message" role="alert" hidden></p>
            <div class="auth-switch">
                <button type="button" class="auth-tab active" data-form="login" aria-pressed="true">登录</button>
                <button type="button" class="auth-tab" data-form="register" aria-pressed="false">注册</button>
            </div>

            <form id="loginForm" class="auth-form active">
                <div class="input-group">
                    <i class="fas fa-envelope input-icon" aria-hidden="true"></i>
                    <input type="email" name="email" class="auth-input" placeholder="电子邮箱"
                           aria-label="电子邮箱" autocomplete="email" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock input-icon" aria-hidden="true"></i>
                    <input type="password" name="password" class="auth-input" placeholder="密码"
                           aria-label="密码" autocomplete="current-password" required>
                </div>
                <button type="submit" class="modern-cta">
                    立即登录
                    <i class="fas fa-arrow-right" aria-hidden="true"></i>
                </button>
            </form>

            <form id="registerForm" class="auth-form">
                <div class="input-group">
                    <i class="fas fa-user input-icon" aria-hidden="true"></i>
                    <input type="text" name="username" class="auth-input" placeholder="用户名"
                           aria-label="用户名" autocomplete="username" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-envelope input-icon" aria-hidden="true"></i>
                    <input type="email" name="email" class="auth-input" placeholder="电子邮箱"
                           aria-label="电子邮箱" autocomplete="email" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock input-icon" aria-hidden="true"></i>
                    <input type="password" name="password" class="auth-input" placeholder="密码"
                           aria-label="密码" autocomplete="new-password" minlength="8" maxlength="72" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock input-icon" aria-hidden="true"></i>
                    <input type="password" name="confirmPassword" class="auth-input" placeholder="确认密码"
                           aria-label="确认密码" autocomplete="new-password" minlength="8" maxlength="72" required>
                </div>
                <button type="submit" class="modern-cta">
                    立即注册
                    <i class="fas fa-user-plus" aria-hidden="true"></i>
                </button>
            </form>

            <div class="auth-footer">
                <p>忘记密码？<a href="mailto:dsjd@vcsc.org.cn">联系客服</a></p>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h3>产品与服务</h3>
                <p><i class="fas fa-seedling" aria-hidden="true"></i> 当季蔬果</p>
                <p><i class="fas fa-apple-alt" aria-hidden="true"></i> 时令水果</p>
                <p><i class="fas fa-spa" aria-hidden="true"></i> 园艺花卉</p>
            </div>
            <div class="footer-section">
                <h3>联系我们</h3>
                <p><i class="fas fa-phone" aria-hidden="true"></i> 400-800-1234</p>
                <p><i class="fas fa-envelope" aria-hidden="true"></i> dsjd@vcsc.org.cn</p>
                <p><i class="fas fa-trophy" aria-hidden="true"></i> 世界职业院校技能大赛</p>
            </div>
            <div class="footer-section">
                <h3>关注我们</h3>
                <div class="social-icons">
                    <a href="#" aria-label="微信"><i class="fab fa-weixin" aria-hidden="true"></i></a>
                    <a href="#" aria-label="微博"><i class="fab fa-weibo" aria-hidden="true"></i></a>
                    <a href="#" aria-label="抖音"><i class="fab fa-tiktok" aria-hidden="true"></i></a>
                    <a href="#" aria-label="Instagram"><i class="fab fa-instagram" aria-hidden="true"></i></a>
                </div>
            </div>
        </div>
        <div class="copyright">
            <p>© 2025 绿源农业 版权所有 | 有机食品认证号: OC-2023-12345</p>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/auth-nav.js"></script>
    <script src="js/cart-store.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
