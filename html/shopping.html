<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物车 - 绿源农业</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"> 
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/nav.css">
    <link rel="stylesheet" href="../css/shopping.css">

</head>
<body>
    <nav>
        <div class="nav-container">
            <h2 style="color: white;">绿源农业</h2>
            <div class="nav-links">
                <a href="./index.html"> 首页</a>
                <a href="./products.html"> 产品中心</a>
                <a href="./about.html"> 关于我们</a>
                <a href="./shopping.html"> 购物车</a>
                <a href="./login.html">登录</a>
            </div>
        </div>
    </nav>
 
    <div class="cart-container">
        <div class="cart-header">
            <h1>购物车</h1>
            <p id="cart-count">您已选择0件商品</p>
        </div>
 
        <div class="cart-items" id="cart-items-container">
            <!-- 购物车商品将通过JS动态生成 -->
        </div>
 
        <div class="summary-card" id="summary-card">
            <div class="summary-row">
                <span>商品合计</span>
                <span id="subtotal">¥0.00</span>
            </div>
            <div class="summary-row">
                <span>运费</span>
                <span>¥0.00</span>
            </div>
            <div class="summary-row">
                <span>优惠</span>
                <span style="color:#ff3b30;">-¥0.00</span>
            </div>
            <div class="summary-row total-price">
                <span>总计</span>
                <span id="total">¥0.00</span>
            </div>
            <button class="modern-cta checkout-btn" id="checkout-btn">
                <span>前往结算</span>
                <svg class="icon-arrow" viewBox="0 0 24 24" width="18" height="18">
                    <path fill="currentColor" d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
                </svg>
            </button>
        </div>
    </div>
 
    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h3>产品与服务</h3>
                <p><i class="fas fa-seedling"></i> 当季蔬果</p>
                <p><i class="fas fa-apple-alt"></i> 时令水果</p>
                <p><i class="fas fa-spa"></i> 园艺花卉</p>
            </div>
            <div class="footer-section">
                <h3>联系我们</h3>
                <p><i class="fas fa-phone"></i> 400-800-1234</p>
                <p><i class="fas fa-envelope"></i> dsjd@vcsc.org.cn</p> 
                <p><i class="fas fa-trophy"></i> 世界职业院校技能大赛</p>
            </div>
            <div class="footer-section">
                <h3>关注我们</h3>
                <div class="social-icons">
                    <a href="#"><i class="fab fa-weixin"></i></a>
                    <a href="#"><i class="fab fa-weibo"></i></a>
                    <a href="#"><i class="fab fa-tiktok"></i></a>
                    <a href="#"><i class="fab fa-instagram"></i></a>
                </div>
            </div>
        </div>
        <div class="copyright">
            <p>© 2025 绿源农业 版权所有 | 有机食品认证号: OC-2023-12345</p>
        </div>
    </footer>
<script src="../script/shopping.js"></script>
</body>
</html>
