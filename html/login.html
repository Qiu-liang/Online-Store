<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绿源农业 - 登录注册</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/nav.css">
    <link rel="stylesheet" href="../css/footer.css">
    
</head>
<body>
    <nav>
        <div class="nav-container">
            <h2 style="color: white;">绿源农业</h2>
            <div class="nav-links">
                <a href="./index.html">首页</a>
                <a href="./products.html">产品中心</a>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-switch">
                <button class="auth-tab active" data-form="login">登录</button>
                <button class="auth-tab" data-form="register">注册</button>
            </div>

            <!-- 登录表单 -->
            <form id="loginForm" class="auth-form active">
                <div class="input-group">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" class="auth-input" placeholder="电子邮箱" required>
                </div>

                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" class="auth-input" placeholder="密码" required>
                </div>

                <button type="submit" class="modern-cta">
                    立即登录
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <!-- 注册表单 -->
            <form id="registerForm" class="auth-form">
                <div class="input-group">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" class="auth-input" placeholder="用户名" required>
                </div>

                <div class="input-group">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" class="auth-input" placeholder="电子邮箱" required>
                </div>

                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" class="auth-input" placeholder="密码" required>
                </div>

                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" class="auth-input" placeholder="确认密码" required>
                </div>

                <button type="submit" class="modern-cta">
                    立即注册
                    <i class="fas fa-user-plus"></i>
                </button>
            </form>

            <div class="auth-footer">
                <p>忘记密码？<a href="#reset">重置密码</a></p>
                <div style="margin-top: 25px;">
                    <!-- <p>其他登录方式</p>
                    <div style="display: flex; gap: 20px; justify-content: center; margin-top: 15px;">
                        <button class="modern-cta" style="background: #2DC100; padding: 12px;">
                            <i class="fab fa-weixin"></i>
                        </button>
                        <button class="modern-cta" style="background: #009FE9; padding: 12px;">
                            <i class="fab fa-alipay"></i>
                        </button> -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../script/login.js"></script>
</body>
</html>
